    height: 844px;

    overflow: hidden;

    border-radius: 40px;

    display: flex;
    flex-direction: column;

    height: 44px;

    padding: 0 24px;
    font-size: 15px;
    font-weight: 600;
    color: #000;
    z-index: 10;

  .status-right { display: flex; align-items: center; gap: 6px; }
  .battery { width: 22px; height: 11px; border: 1px solid #000; border-radius: 3px; position: relative; }

  .message {
    display: flex;
    margin: 8px 0;
    align-items: flex-end;
  }
  .message.left { justify-content: flex-start; }
  .message.right { justify-content: flex-end; }
  .bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
  }
  .left .bubble { background: white; color: #000; border-bottom-left-radius: 4px; }
  .right .bubble { background: #fee500; color: #000; border-bottom-right-radius: 4px; }
  .time { font-size: 11px; color: #888; margin: 0 6px; white-space: nowrap; }
  .input-bar {
    background: #fff;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    border-top: 1px solid #e5e5e5;
  }
  .plus { font-size: 24px; margin-right: 8px; color: #555; }
  .input {
    flex: 1; border: none; outline: none; font-size: 15px;
    padding: 8px 12px; background: #f5f5f5; border-radius: 20px;
  }
  .emoji, .send { font-size: 22px; margin-left: 8px; cursor: pointer; }
  .send { color: #fee500; }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: #000; border-radius: 3px; opacity: 0.3;
  }
  .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }
